<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bienenfeld — Psychodynamic Theory for Clinicians</title>
<style>
  :root {
    --ink: #1b1a17;
    --paper: #f6f1e8;
    --card: #fffdf8;
    --line: #d9d0c1;
    --accent: #9a3412;
    --ok: #166534;
    --bad: #991b1b;
    --muted: #6b6258;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, serif; }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 18px; background: #2b2118; color: #f6f1e8;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  header p { margin: 0; font-size: 12px; opacity: .75; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  button, select {
    font: 13px/1.2 ui-sans-serif, system-ui, sans-serif;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  header button, header select { background: #3d3126; color: #f6f1e8; border-color: #5a4a3a; }
  .search {
    display: flex; align-items: center; gap: 6px;
    background: #3d3126; border: 1px solid #5a4a3a; border-radius: 8px;
    padding: 3px 6px 3px 8px;
  }
  .search input {
    width: min(42vw, 240px); border: 0; background: transparent; color: #f6f1e8;
    font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; padding: 5px 4px; outline: none;
  }
  .search input::placeholder { color: #c4b4a2; }
  .search-count {
    font: 12px/1 ui-sans-serif, system-ui, sans-serif; color: #e8d5bf; min-width: 4.5em; text-align: right;
  }
  .search button { padding: 4px 8px; min-width: 32px; }
  .search button:disabled { opacity: .4; cursor: default; }
  .page-frame {
    position: relative; display: inline-block; width: 100%; max-width: 720px;
  }
  .page-frame img.page { display: block; width: 100%; max-width: 720px; }
  .hit-layer { position: absolute; inset: 0; pointer-events: none; }
  .hitbox {
    position: absolute;
    background: rgba(250, 204, 21, 0.38);
    outline: 2px solid rgba(202, 138, 4, 0.9);
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset;
    scroll-margin-top: 90px;
  }
  .hitbox.current {
    background: rgba(249, 115, 22, 0.42);
    outline: 2px solid #c2410c;
    box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.28);
  }
  .ocr mark { background: #fde68a; color: inherit; padding: 0 1px; border-radius: 2px; }
  .ocr mark.current { background: #fdba74; outline: 1px solid #c2410c; scroll-margin-top: 90px; }
  .page-sec { scroll-margin-top: 80px; }
  .wrap { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 58px); }
  aside { border-right: 1px solid var(--line); padding: 12px; overflow: auto; background: #efe7d8; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
  aside a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 5px; color: inherit; text-decoration: none; font-size: 14px; }
  aside a:hover, aside a.active { background: #e0d3bb; }
  .chnum {
    flex: 0 0 1.6em; font: 700 15px/1.2 ui-sans-serif, system-ui, sans-serif;
    color: #9a3412; text-align: center;
  }
  .chtitle { flex: 1; }
  main { padding: 20px 24px 80px; max-width: 980px; }
  .page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .page-head h2 { margin: 0 0 8px; font-size: 22px; }
  .meta { color: var(--muted); font-size: 13px; font-family: ui-sans-serif, system-ui, sans-serif; }
  img.page { width: 100%; max-width: 720px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .ocr { white-space: pre-wrap; font-size: 15px; background: var(--card); border: 1px solid var(--line); padding: 16px 18px; border-radius: 6px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 14px 0; }
  .q .stem { font-weight: 600; margin-bottom: 8px; }
  .opt { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px; }
  .opt.correct { background: #dcfce7; border-color: #86efac; }
  .opt.wrong { background: #fee2e2; border-color: #fca5a5; }
  .expl { display: none; margin-top: 10px; font-size: 14.5px; color: #3f3a33; }
  .expl.show { display: block; }
  .quote { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 8px; }
  .toolbar { display: flex; gap: 8px; margin: 12px 0 18px; }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Psychodynamic Theory for Clinicians</h1>
    <p>David Bienenfeld · Psychotherapy in Clinical Practice ·
      <a id="back" href="/?bank=therapy" style="color:#f0d9b5">Back to PRITE Daily</a>
    </p>
  </div>
  <nav>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search the book…" enterkeyhint="search" />
      <span id="search-count" class="search-count"></span>
      <button type="button" id="hit-prev" title="Previous match (Shift+Enter)" disabled>↑</button>
      <button type="button" id="hit-next" title="Next match (Enter)" disabled>↓</button>
    </form>
    <select id="mode">
      <option value="read">Read chapter</option>
      <option value="quiz">Quiz this page</option>
      <option value="quiz-ch">Quiz this chapter</option>
    </select>
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
  </nav>
</header>
<div class="wrap">
  <aside id="toc"></aside>
  <main id="main">Loading…</main>
</div>
<script>
const state = {
  chapters: [], pages: [], questions: [], ch: 0, page: 0, mode: "read",
  words: null, wordsPromise: null,
  search: { q: "", hits: [], i: 0, status: "" },
  applyingHash: false,
};

function backHref() {
  const p = new URLSearchParams(location.search);
  const bank = p.get("bank") || "therapy";
  let qid = p.get("qid") || "";
  let view = p.get("view") || "";
  if (!qid) {
    try {
      const saved = JSON.parse(localStorage.getItem("pd_therapy_return") || "null");
      if (saved && saved.qid) {
        qid = String(saved.qid);
        if (!view && saved.view) view = String(saved.view);
      }
    } catch (e) { /* ignore */ }
  }
  const out = new URLSearchParams();
  out.set("bank", bank);
  if (qid) out.set("qid", qid);
  if (view) out.set("view", view);
  return "/?" + out.toString();
}

function bindBackLink() {
  const a = document.getElementById("back");
  if (a) a.setAttribute("href", backHref());
}

async function load() {
  bindBackLink();
  const [ch, pg, qs] = await Promise.all([
    fetch("chapters.json").then(r => r.json()).catch(() => []),
    fetch("pages.json").then(r => r.json()).catch(() => []),
    fetch("questions/all.json").then(r => r.json()).catch(() => []),
  ]);
  state.chapters = ch;
  state.pages = pg;
  state.questions = qs;
  applyLocation(ch, pg, qs);
  renderToc();
  render();
  if (state.search.pending) {
    const q = state.search.pending;
    state.search.pending = "";
    const box = document.getElementById("q");
    if (box) box.value = q;
    await runSearch(q);
  }
}

function applyLocation(ch, pg, qs) {
  const raw = location.hash.replace(/^#/, "");
  if (!raw) return;
  const params = raw.includes("=") ? new URLSearchParams(raw) : null;
  const chId = params?.get("ch");
  const qid = params?.get("q");
  const pageKey = params?.get("p") || (!params ? raw : "");
  if (qid) {
    const item = qs.find(q => q.id === qid);
    const printed = item?.bienenfeld?.page;
    const i = printed != null ? pg.findIndex(p => p.printed_int === printed) : -1;
    if (i >= 0) {
      state.page = i;
      state.ch = Math.max(0, ch.findIndex(c => c.id === pg[i].chapter_id));
      return;
    }
  }
  if (chId) {
    const ci = ch.findIndex(c => c.id === chId || String(c.number) === chId);
    if (ci >= 0) {
      state.ch = ci;
      const first = pg.findIndex(p => p.chapter_id === ch[ci].id);
      if (first >= 0) state.page = first;
    }
  }
  if (pageKey) {
    const i = pg.findIndex(p => String(p.printed_int) === pageKey || p.tag === pageKey);
    if (i >= 0) {
      state.page = i;
      state.ch = Math.max(0, ch.findIndex(c => c.id === pg[i].chapter_id));
    }
  }
  const searchQ = params?.get("search");
  if (searchQ) state.search.pending = searchQ;
}

function pagesOf(ch) {
  const id = state.chapters[ch]?.id;
  return state.pages.map((p, i) => ({p, i})).filter(x => x.p.chapter_id === id);
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function escapeRe(s) {
  return String(s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function normToken(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function renderToc() {
  const el = document.getElementById("toc");
  el.innerHTML = state.chapters.map((c, i) => {
    const n = (c.pages || []).length;
    const num = c.number ? `<span class="chnum">${c.number}</span>` : "";
    return `<h2>${c.kind}</h2><a href="#" data-ch="${i}" class="${i===state.ch?"active":""}">${num}<span class="chtitle">${c.title.replace(/^[0-9A-D]\s+/, "")}</span> <span class="meta">(${n})</span></a>`;
  }).join("");
  el.querySelectorAll("a").forEach(a => a.onclick = (e) => {
    e.preventDefault();
    state.ch = +a.dataset.ch;
    const first = state.pages.findIndex(p => p.chapter_id === state.chapters[state.ch].id);
    state.page = first < 0 ? state.page : first;
    renderToc(); render();
  });
}

function qsFor(filter) {
  return state.questions.filter(filter);
}

function renderQuiz(items) {
  if (!items.length) return `<p class="meta">No questions written for this selection yet.</p>`;
  return items.map((q, qi) => {
    const opts = (q.options || []).map(o =>
      `<button class="opt" data-qi="${qi}" data-letter="${o.letter}">${o.letter}. ${o.text}</button>`
    ).join("");
    const quote = q.bienenfeld?.quote ? `<div class="quote">p. ${q.bienenfeld.page}: ${q.bienenfeld.quote}</div>` : "";
    return `<article class="q" id="q${qi}">
      <div class="stem">${qi+1}. ${q.stem}</div>
      ${opts}
      <div class="expl">${q.explanation_text || ""}${quote}</div>
    </article>`;
  }).join("");
}

function markOcr(text, query, currentNth) {
  const raw = String(text || "");
  const re = textRe(query);
  if (!re) return escapeHtml(raw);
  let n = 0;
  let out = "";
  let last = 0;
  let m;
  while ((m = re.exec(raw))) {
    out += escapeHtml(raw.slice(last, m.index));
    const cls = n++ === currentNth ? ' class="current"' : "";
    out += `<mark${cls}>${escapeHtml(m[0])}</mark>`;
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}

function mergeBoxes(rows) {
  const items = rows.map(w => ({ x: w[1], y: w[2], w: w[3], h: w[4] }))
    .sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const it of items) {
    const line = lines.find(L => Math.abs(L.y - it.y) < Math.max(L.h, it.h) * 0.55);
    if (!line) {
      lines.push({ ...it });
      continue;
    }
    const r = Math.max(line.x + line.w, it.x + it.w);
    const b = Math.max(line.y + line.h, it.y + it.h);
    line.x = Math.min(line.x, it.x);
    line.y = Math.min(line.y, it.y);
    line.w = r - line.x;
    line.h = b - line.y;
  }
  return lines;
}

function textRe(query) {
  const q = String(query || "").trim();
  if (!q) return null;
  if (q.length <= 3 && !/\s/.test(q)) return new RegExp(`\\b${escapeRe(q)}\\b`, "ig");
  return new RegExp(escapeRe(q), "ig");
}

function findBoxHits(words, query) {
  const qn = normToken(query);
  if (!qn || !words?.length) return [];
  const short = qn.length <= 3 && !/\s/.test(String(query || "").trim());
  let joined = "";
  const spans = [];
  for (let i = 0; i < words.length; i++) {
    const n = normToken(words[i][0]);
    if (!n) continue;
    const start = joined.length;
    joined += n;
    spans.push({ start, end: joined.length, i });
  }
  const hits = [];
  let from = 0;
  while (from <= joined.length - qn.length) {
    const at = joined.indexOf(qn, from);
    if (at < 0) break;
    const end = at + qn.length;
    const atWordStart = spans.some(s => s.start === at);
    if (short && !atWordStart) {
      from = at + 1;
      continue;
    }
    const idxs = spans.filter(s => s.end > at && s.start < end).map(s => s.i);
    if (idxs.length) hits.push(mergeBoxes(idxs.map(i => words[i])));
    from = at + Math.max(1, qn.length);
  }
  return hits;
}

function countTextMatches(text, query) {
  const re = textRe(query);
  if (!re) return 0;
  return (String(text || "").match(re) || []).length;
}

function buildHits(query) {
  const q = String(query || "").trim();
  if (q.length < 2) return [];
  const hits = [];
  const wordsRoot = state.words?.pages || {};
  for (let i = 0; i < state.pages.length; i++) {
    const p = state.pages[i];
    const words = wordsRoot[p.image]?.words || [];
    const boxes = findBoxHits(words, q);
    if (boxes.length) {
      boxes.forEach((boxSet, nth) => hits.push({ page: i, boxes: boxSet, textNth: nth }));
      continue;
    }
    const n = countTextMatches(p.text || "", q);
    for (let nth = 0; nth < n; nth++) hits.push({ page: i, boxes: [], textNth: nth });
  }
  return hits;
}

function ensureWords() {
  if (state.words) return Promise.resolve(state.words);
  if (state.wordsPromise) return state.wordsPromise;
  state.wordsPromise = fetch("words.json")
    .then(r => r.ok ? r.json() : { pages: {} })
    .catch(() => ({ pages: {} }))
    .then(data => { state.words = data || { pages: {} }; return state.words; });
  return state.wordsPromise;
}

function updateSearchChrome() {
  const count = document.getElementById("search-count");
  const prev = document.getElementById("hit-prev");
  const next = document.getElementById("hit-next");
  const { q, hits, i, status } = state.search;
  if (status) {
    count.textContent = status;
    prev.disabled = true;
    next.disabled = true;
    return;
  }
  if (!q) {
    count.textContent = "";
    prev.disabled = true;
    next.disabled = true;
    return;
  }
  if (!hits.length) {
    count.textContent = "0 matches";
    prev.disabled = true;
    next.disabled = true;
    return;
  }
  count.textContent = `${i + 1} / ${hits.length}`;
  prev.disabled = false;
  next.disabled = false;
}

function currentHitOnPage(pageIndex) {
  const { hits, i } = state.search;
  const cur = hits[i];
  if (!cur || cur.page !== pageIndex) return -1;
  return cur.textNth;
}

function paintHits() {
  const q = state.search.q;
  const hits = state.search.hits;
  const cur = hits[state.search.i];
  document.querySelectorAll(".page-sec").forEach(sec => {
    const tag = sec.dataset.tag;
    const pageIndex = state.pages.findIndex(p => p.tag === tag);
    const layer = sec.querySelector(".hit-layer");
    if (layer) {
      const mine = hits.filter(h => h.page === pageIndex);
      layer.innerHTML = mine.flatMap(h => h.boxes.map(box => {
        const on = h === cur ? " current" : "";
        return `<i class="hitbox${on}" style="left:${box.x*100}%;top:${box.y*100}%;width:${box.w*100}%;height:${box.h*100}%"></i>`;
      })).join("");
    }
    const details = sec.querySelector("details");
    const ocr = sec.querySelector(".ocr");
    if (ocr) {
      const p = state.pages[pageIndex];
      ocr.innerHTML = markOcr(p?.text || "", q, currentHitOnPage(pageIndex));
      if (details && q && mineHasText(hits, pageIndex)) details.open = true;
    }
  });
}

function mineHasText(hits, pageIndex) {
  return hits.some(h => h.page === pageIndex);
}

function scrollToCurrentHit() {
  const curBox = document.querySelector(".hitbox.current");
  if (curBox) {
    curBox.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const mark = document.querySelector(".ocr mark.current");
  if (mark) {
    mark.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const p = state.pages[state.page];
  const here = p && document.getElementById("pg-" + p.tag);
  if (here) here.scrollIntoView({ behavior: "smooth", block: "start" });
}

function goToHit(index, opts = {}) {
  const hits = state.search.hits;
  if (!hits.length) { updateSearchChrome(); return; }
  state.search.i = ((index % hits.length) + hits.length) % hits.length;
  const hit = hits[state.search.i];
  const p = state.pages[hit.page];
  const modeEl = document.getElementById("mode");
  const needRender = state.mode !== "read"
    || !document.querySelector(`.page-sec[data-tag="${p.tag}"]`);
  state.page = hit.page;
  state.ch = Math.max(0, state.chapters.findIndex(c => c.id === p.chapter_id));
  if (modeEl) modeEl.value = "read";
  if (needRender) {
    renderToc();
    render({ scroll: false });
  } else {
    renderToc();
    setHash(p);
    paintHits();
  }
  updateSearchChrome();
  if (opts.scroll !== false) requestAnimationFrame(() => scrollToCurrentHit());
}

async function runSearch(query, opts = {}) {
  const q = String(query || "").trim();
  state.search.q = q;
  if (q.length < 2) {
    state.search.hits = [];
    state.search.i = 0;
    state.search.status = "";
    updateSearchChrome();
    paintHits();
    return;
  }
  state.search.status = "Searching…";
  updateSearchChrome();
  await ensureWords();
  if (state.search.q !== q) return;
  state.search.hits = buildHits(q);
  state.search.status = "";
  if (!state.search.hits.length) {
    state.search.i = 0;
    updateSearchChrome();
    paintHits();
    return;
  }
  if (opts.stay && state.search.hits[state.search.i]?.page === state.page) {
    goToHit(state.search.i);
    return;
  }
  const fromHere = state.search.hits.findIndex(h => h.page >= state.page);
  goToHit(fromHere >= 0 ? fromHere : 0);
}

function render(opts = {}) {
  const main = document.getElementById("main");
  const p = state.pages[state.page];
  if (!p) { main.innerHTML = "<p>No pages assembled yet. Run assemble_book.py.</p>"; return; }
  const mode = document.getElementById("mode").value;
  state.mode = mode;
  const label = p.printed_page || p.tag;
  const head = `<div class="page-head"><h2>${p.chapter_title || ""}</h2>
    <div class="meta">Printed page ${label} · ${p.tag}</div></div>
    <div class="toolbar"><span class="meta">${state.page+1} / ${state.pages.length}</span></div>`;

  if (mode === "quiz") {
    const items = qsFor(q => q.bienenfeld && String(q.bienenfeld.page) === String(p.printed_int || p.printed_page));
    main.innerHTML = head + renderQuiz(items);
  } else if (mode === "quiz-ch") {
    const items = qsFor(q => q.bienenfeld && q.bienenfeld.chapter_id === p.chapter_id);
    main.innerHTML = head + `<p class="meta">${items.length} items in this chapter.</p>` + renderQuiz(items);
  } else {
    const rest = state.pages.filter(x => x.chapter_id === p.chapter_id);
    const q = state.search.q;
    const chapter = rest.map(x => {
      const lab = x.printed_page || x.tag;
      const pageIndex = state.pages.indexOf(x);
      const im = x.image ? `<img class="page" src="${x.image}" alt="page ${lab}">` : "";
      const tx = markOcr(x.text || "", q, currentHitOnPage(pageIndex));
      const open = q && mineHasText(state.search.hits, pageIndex) ? " open" : "";
      return `<section class="page-sec" id="pg-${escapeHtml(x.tag)}" data-tag="${escapeHtml(x.tag)}">
        <div class="page-head"><h3>Page ${lab}</h3></div>
        <div class="page-frame">${im}<div class="hit-layer"></div></div>
        <details${open}><summary>OCR text</summary><div class="ocr">${tx}</div></details>
      </section>`;
    }).join("<hr>");
    const hint = state.search.q
      ? `Search “${escapeHtml(state.search.q)}” — highlights are on the page image; use ↑ ↓ to jump.`
      : `Full chapter · ${rest.length} pages. Search the book from the header, or expand OCR under each page.`;
    main.innerHTML = head + `<p class="meta">${hint}</p>` + chapter;
    paintHits();
    if (opts.scroll !== false) {
      const here = document.getElementById("pg-" + p.tag);
      if (here) here.scrollIntoView({behavior:"smooth", block:"start"});
    }
  }
  bindQuiz();
  setHash(p);
}

function setHash(p) {
  const next = String(p.printed_int || p.printed_page || p.tag);
  const cur = location.hash.replace(/^#/, "");
  if (cur === next) return;
  state.applyingHash = true;
  location.hash = next;
  queueMicrotask(() => { state.applyingHash = false; });
}

function bindQuiz() {
  document.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => {
      const qi = +btn.dataset.qi;
      const mode = state.mode;
      const p = state.pages[state.page];
      const items = mode === "quiz-ch"
        ? qsFor(q => q.bienenfeld && q.bienenfeld.chapter_id === p.chapter_id)
        : qsFor(q => q.bienenfeld && String(q.bienenfeld.page) === String(p.printed_int || p.printed_page));
      const q = items[qi];
      const card = btn.closest(".q");
      card.querySelectorAll(".opt").forEach(b => {
        b.classList.remove("correct","wrong");
        if (b.dataset.letter === q.answer_letter) b.classList.add("correct");
      });
      if (btn.dataset.letter !== q.answer_letter) btn.classList.add("wrong");
      card.querySelector(".expl").classList.add("show");
    };
  });
}

window.addEventListener("hashchange", () => {
  if (state.applyingHash) return;
  applyLocation(state.chapters, state.pages, state.questions);
  renderToc();
  render();
});
document.getElementById("mode").onchange = render;
document.getElementById("prev").onclick = () => {
  if (state.mode === "read") {
    const list = pagesOf(state.ch);
    const idx = list.findIndex(x => x.i === state.page);
    if (idx > 0) state.page = list[idx-1].i;
    else if (state.ch > 0) {
      state.ch -= 1;
      const prev = pagesOf(state.ch);
      if (prev.length) state.page = prev[prev.length-1].i;
    }
  } else {
    state.page = Math.max(0, state.page-1);
    state.ch = Math.max(0, state.chapters.findIndex(c => c.id === state.pages[state.page].chapter_id));
  }
  renderToc(); render();
};
document.getElementById("next").onclick = () => {
  if (state.mode === "read") {
    const list = pagesOf(state.ch);
    const idx = list.findIndex(x => x.i === state.page);
    if (idx < list.length-1) state.page = list[idx+1].i;
    else if (state.ch < state.chapters.length-1) {
      state.ch += 1;
      const nxt = pagesOf(state.ch);
      if (nxt.length) state.page = nxt[0].i;
    }
  } else {
    state.page = Math.min(state.pages.length-1, state.page+1);
    state.ch = Math.max(0, state.chapters.findIndex(c => c.id === state.pages[state.page].chapter_id));
  }
  renderToc(); render();
};

const searchInput = document.getElementById("q");
let searchTimer = 0;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(searchInput.value), 180);
});
document.getElementById("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.search.hits.length) goToHit(state.search.i + 1);
  else runSearch(searchInput.value);
});
document.getElementById("hit-next").onclick = () => goToHit(state.search.i + 1);
document.getElementById("hit-prev").onclick = () => goToHit(state.search.i - 1);

document.addEventListener("keydown", (e) => {
  const inField = e.target.matches("input, textarea, select");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }
  if (e.key === "Escape" && document.activeElement === searchInput) {
    searchInput.value = "";
    runSearch("");
    searchInput.blur();
    return;
  }
  if (e.key === "Enter" && document.activeElement === searchInput) {
    e.preventDefault();
    if (state.search.hits.length) goToHit(state.search.i + (e.shiftKey ? -1 : 1));
    else runSearch(searchInput.value);
    return;
  }
  if ((e.key === "F3" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "g")) && state.search.hits.length) {
    e.preventDefault();
    goToHit(state.search.i + (e.shiftKey ? -1 : 1));
    return;
  }
  if (inField) return;
});

load();
</script>
</body>
